lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  apps/api:
    dependencies:
      '@kasane/core':
        specifier: workspace:*
        version: link:../../packages/core

  apps/student:
    dependencies:
      '@kasane/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@kasane/ui':
        specifier: workspace:*
        version: link:../../packages/ui

  apps/teacher:
    dependencies:
      '@kasane/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@kasane/ui':
        specifier: workspace:*
        version: link:../../packages/ui

  packages/core: {}

  packages/ui: {}

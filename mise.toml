[tools]
bun = "1.4.2"
node = "26.10.0"
pnpm = "12.9.1"

[tasks]
dev = "pnpm exec turbo run dev"
typecheck = "pnpm exec turbo run typecheck"
build = "pnpm exec turbo run build"
test = "pnpm exec turbo run test"
lint = "pnpm exec turbo run //#lint --"
"lint:fix" = "pnpm exec turbo run //#lint:fix --"
"lint:fsd" = "pnpm exec turbo run lint:fsd"
fmt = "pnpm exec turbo run //#fmt --"
"fmt:fix" = "pnpm exec turbo run //#fmt:fix"
check = "pnpm exec turbo run //#check lint:fsd"
"check:fix" = "pnpm exec turbo run //#check:fix"
storybook = "pnpm exec turbo run storybook"

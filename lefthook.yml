pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: "mise run lint {staged_files}"
    - name: fmt
      run: mise run fmt {staged_files}

pre-push:
  jobs:
    - name: check
      run: mise run check
    - name: typecheck
      run: mise run typecheck
    - name: build
      run: mise run build

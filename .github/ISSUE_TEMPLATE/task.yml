name: タスク
description: 実装・リファクタリング・ドキュメント作成などのタスクを起票するためのIssue
body:
  - type: textarea
    id: background-and-purpose
    attributes:
      label: 背景・目的
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: スコープ
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 非スコープ

  - type: textarea
    id: sub-issues
    attributes:
      label: サブIssue

  - type: textarea
    id: references
    attributes:
      label: リファレンス
